version: '3.8'

services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespw}
    volumes:
      - ./Doc_opr/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  doc_opr:
    build:
      context: ./Doc_opr
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"
      - "443:443"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-authdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespw}"
      # If you want HTTPS in container, mount a PFX to /https/aspnetapp.pfx and set the password
      # ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      # ASPNETCORE_Kestrel__Certificates__Default__Password: "your-pfx-password"
    # Optionally mount certificate volume for HTTPS
    # volumes:
    #   - ./certs/aspnetapp.pfx:/https/aspnetapp.pfx:ro

secrets:
  # Example of defining secrets for use with swarm or supported orchestrators.
  db_password:
    file: .secrets/db_password.txt
  cert_password:
    file: .secrets/aspnet_cert_password.txt
